name: Best Cars CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint_backend:
    name: Lint backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        working-directory: server
        run: python -m pip install -r requirements.txt
      - name: Lint Python backend
        working-directory: server
        run: python -m compileall -q .
      - name: Post lint result
        run: echo "Backend lint completed successfully"

  lint_frontend:
    name: Lint frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: server/frontend
        run: npm ci
      - name: Lint React frontend
        working-directory: server/frontend
        run: CI=false npm run build
      - name: Post lint result
        run: echo "Frontend lint/build completed successfully"

  verify:
    name: Verify Django and React application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        working-directory: server
        run: python -m pip install -r requirements.txt
      - name: Run Django system checks
        working-directory: server
        run: python manage.py check
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: server/frontend
        run: npm ci
      - name: Build React frontend
        working-directory: server/frontend
        run: CI=false npm run build
      - name: Report verification steps
        run: |
          echo "Django system checks completed successfully"
          echo "React production build completed successfully"
          echo "Best Cars CI workflow completed successfully"
